name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +o pipefail
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find "$ANDROID_SDK" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDK_MANAGER" --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 -name 'settings.gradle.kts' | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: settings.gradle.kts tidak ditemukan. Pastikan isi folder TKAStudio-Android sudah di-upload ke repository."
            exit 1
          fi
          cd "$(dirname "$SETTINGS_FILE")"
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TKAStudio-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
